<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clackwork</title>
  <meta name="description" content="Clackwork is a macOS menu bar app that plays mechanical keyboard sounds as you type, in any app.">
  <link rel="icon" href="favicon.png" type="image/png">
  <meta property="og:title" content="Clackwork">
  <meta property="og:description" content="Mechanical keyboard sounds as you type, in any app on your Mac.">
  <meta property="og:image" content="https://khamkarsuraj.github.io/clackwork/icon.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0a84ff;
      --accent-fg: #ffffff;
      --rule: rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --fg: #f5f5f7;
        --muted: #98989d;
        --accent: #0a84ff;
        --rule: rgba(255, 255, 255, 0.1);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 16px 48px;
    }
    .icon {
      width: 128px;
      height: 128px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 44px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      font-weight: 700;
    }
    .tagline {
      font-size: 21px;
      color: var(--muted);
      margin: 0 0 32px;
      max-width: 32ch;
    }
    .download {
      display: inline-block;
      background: var(--accent);
      color: var(--accent-fg);
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
      padding: 14px 28px;
      border-radius: 999px;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .download:hover { filter: brightness(1.08); }
    .download:active { transform: scale(0.98); }
    .download:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .meta {
      margin: 14px 0 0;
      font-size: 14px;
      color: var(--muted);
    }
    footer {
      border-top: 1px solid var(--rule);
      padding: 20px 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    footer a { color: inherit; }
    @media (max-width: 480px) {
      h1 { font-size: 36px; }
      .tagline { font-size: 19px; }
      .icon { width: 104px; height: 104px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .download { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" width="128" height="128" alt="">
    <h1>Clackwork</h1>
    <p class="tagline">Mechanical keyboard sounds as you type, in any app on your Mac.</p>
    <a id="download" class="download" href="https://github.com/khamkarsuraj/clackwork/releases/latest">Download for macOS</a>
    <p id="meta" class="meta">macOS 13 or later · Apple silicon and Intel</p>
  </main>
  <footer>
    <a href="https://github.com/khamkarsuraj/clackwork">Source on GitHub</a>
  </footer>
  <script>
    // Point the button straight at the newest DMG. Until a release exists, or if the
    // request fails, the button keeps linking to the releases page.
    (async () => {
      const button = document.getElementById("download");
      const meta = document.getElementById("meta");
      try {
        const response = await fetch("https://api.github.com/repos/khamkarsuraj/clackwork/releases/latest", {
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error(response.status);
        const release = await response.json();
        const dmg = (release.assets || []).find(a => a.name.endsWith(".dmg"));
        if (!dmg) throw new Error("no dmg");
        button.href = dmg.browser_download_url;
        const size = (dmg.size / 1048576).toFixed(0);
        const version = String(release.tag_name || "").replace(/^v/, "");
        meta.textContent = `Version ${version} · ${size} MB · macOS 13 or later · Apple silicon and Intel`;
      } catch (_) {
        button.textContent = "See releases on GitHub";
      }
    })();
  </script>
</body>
</html>
