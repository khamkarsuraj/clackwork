name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # macos-15 rather than macos-26: the macOS 26 pool is small and runs sat queued for
    # 10+ minutes, while macos-15 picks up in seconds and also ships Xcode 26 (26.3).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest stable Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Sound packs aren't committed, so CI builds without them; no test depends on them.
      # The app icon is left out too: compiling an Icon Composer .icon needs a macOS 26
      # host ("Failed to generate flattened icon stack" on macos-15), and no test needs it.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project clackwork.xcodeproj \
            -scheme clackwork \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES=AppIcon.icon \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            | tee xcodebuild.log \
            | grep -E '^Test (case|suite)|error:|warning:|\*\* (TEST|BUILD)'

      # The App Store target shares the sources but compiles with APP_STORE; make sure it still builds.
      - name: Build the App Store target
        run: |
          set -o pipefail
          xcodebuild build \
            -project clackwork.xcodeproj \
            -scheme 'clackwork App Store' \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES=AppIcon.icon \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            | tee -a xcodebuild.log \
            | grep -E 'error:|\*\* BUILD'

      - name: Coverage summary
        if: success()
        run: xcrun xccov view --report --only-targets TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
          retention-days: 7
